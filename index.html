<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استعلام بيانات الحساب</title>
    <!-- استدعاء Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-body: #0f172a;        /* رمادي داكن هادئ */
            --card-bg: #1e293b;        /* لون بطاقة مريح ونظيف */
            --card-border: #334155;    /* حدود رمادية طبيعية */
            --input-bg: #0f172a;
            --primary: #2563eb;        /* أزرق عملي هادئ */
            --primary-hover: #1d4ed8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .query-card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 26px 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .card-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .card-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .input-field-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field-wrap input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.95rem;
            color: #ffffff;
            outline: none;
            text-align: left;
            direction: ltr;
            transition: border-color 0.2s;
        }

        .input-field-wrap input:focus {
            border-color: var(--primary);
        }

        .input-field-wrap input::placeholder {
            color: #64748b;
            direction: rtl;
            text-align: right;
            font-size: 0.85rem;
        }

        .btn-query {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-query:hover {
            background: var(--primary-hover);
        }

        .btn-query:active {
            transform: scale(0.99);
        }

        /* مؤشر التحميل السريع */
        .loading-box {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .spinner-ring {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            margin: 0 auto 10px;
            animation: spin 0.7s linear infinite;
        }

        .loading-title {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* كرت عرض النتيجة المنسقة */
        .result-panel {
            display: none;
            margin-top: 18px;
            background: #0f172a;
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
        }

        .result-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .result-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: #94a3b8;
        }

        .status-badge {
            font-size: 0.72rem;
            padding: 2px 8px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border-radius: 6px;
            font-weight: 600;
        }

        /* صندوق إبراز رقم الهاتف مع زر النسخ */
        .phone-callout {
            background: #1e293b;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .phone-val {
            font-size: 1.15rem;
            font-weight: 700;
            color: #38bdf8;
            direction: ltr;
        }

        .btn-copy {
            background: #334155;
            border: none;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #475569;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .data-label { color: var(--text-muted); }
        .data-val { font-weight: 600; direction: ltr; }

        .btn-reset {
            width: 100%;
            margin-top: 14px;
            padding: 9px;
            background: transparent;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
        }

        .alert-box {
            display: none;
            font-size: 0.8rem;
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            margin-top: 12px;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="query-card">
        <div class="card-header">
            <h1>استخراج الهاتف المرتبط</h1>
            <p>أدخل رقم الحساب أو CIF للاستعلام الفوري</p>
        </div>

        <div class="input-group">
            <label>رقم الحساب أو CIF</label>
            <div class="input-field-wrap">
                <input type="tel" id="cifInput" placeholder="أدخل الرقم هنا (مثال: 3034035)" autocomplete="off">
            </div>
        </div>

        <button id="btnSearch" class="btn-query" onclick="runExtraction()">استخراج البيانات</button>

        <!-- لودر خفيف وسريع -->
        <div id="loadingBox" class="loading-box">
            <div class="spinner-ring"></div>
            <div class="loading-title">جاري معالجة الطلب...</div>
        </div>

        <!-- بطاقة النتيجة -->
        <div id="resultPanel" class="result-panel">
            <div class="result-head">
                <span class="result-title">البيانات المستخرجة</span>
                <span id="accountStatusTag" class="status-badge">نشط ✅</span>
            </div>

            <div class="phone-callout">
                <div>
                    <span style="font-size:0.72rem; color:var(--text-muted); display:block;">الهاتف المربوط:</span>
                    <div id="resPhone" class="phone-val">--</div>
                </div>
                <button class="btn-copy" onclick="copyPhone()">
                    <span id="copyBtnText">نسخ</span>
                </button>
            </div>

            <div class="data-row"><span class="data-label">اسم العميل:</span><span id="resName" class="data-val">--</span></div>
            <div class="data-row"><span class="data-label">رقم العميل (CIF):</span><span id="resCif" class="data-val">--</span></div>
            <div class="data-row"><span class="data-label">الفرع:</span><span id="resBranch" class="data-val">--</span></div>
            <div class="data-row"><span class="data-label">رقم الحساب:</span><span id="resAccount" class="data-val">--</span></div>

            <button class="btn-reset" onclick="resetQuery()">استعلام جديد</button>
        </div>

        <div id="alertBox" class="alert-box"></div>
    </div>

<script>
    // إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
        apiKey: "AIzaSyBEF4_R1dnOwpZefYNOMazBhnsmB_SjIHQ",
        authDomain: "apryy-ac426.firebaseapp.com",
        databaseURL: "https://apryy-ac426-default-rtdb.firebaseio.com",
        projectId: "apryy-ac426",
        storageBucket: "apryy-ac426.firebasestorage.app",
        messagingSenderId: "1072046119868",
        appId: "1:1072046119868:web:bef2ff97487dab5a5a69b9",
        measurementId: "G-EMEZ596F5L"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function runExtraction() {
        const input = document.getElementById("cifInput");
        const btn = document.getElementById("btnSearch");
        const loader = document.getElementById("loadingBox");
        const resultPanel = document.getElementById("resultPanel");
        const alertBox = document.getElementById("alertBox");

        const val = input.value.trim();
        if (!val) {
            showAlert("يرجى إدخال رقم الحساب أو الـ CIF أولاً");
            return;
        }

        alertBox.style.display = "none";
        resultPanel.style.display = "none";
        btn.style.display = "none";
        loader.style.display = "block";

        // إرسال الطلب فوراً
        const reqRef = db.ref("inquiries").push();
        reqRef.set({
            query_value: val,
            status: "pending",
            result: "",
            timestamp: Date.now()
        }).then(() => {
            // استماع فوري مباشر دون أي تأخير زمني
            reqRef.on("value", (snap) => {
                const data = snap.val();
                if (!data) return;

                if (data.status === "completed") {
                    loader.style.display = "none";
                    btn.style.display = "block";
                    renderData(data.result);
                    reqRef.off(); // إيقاف الاستماع فور استلام النتيجة
                } else if (data.status === "failed") {
                    loader.style.display = "none";
                    btn.style.display = "block";
                    showAlert("تعذر إكمال الاستعلام: " + (data.result || "يرجى التحقق من الرقم"));
                    reqRef.off();
                }
            });
        }).catch((err) => {
            loader.style.display = "none";
            btn.style.display = "block";
            showAlert("خطأ في الاتصال: " + err.message);
        });
    }

    function renderData(raw) {
        const phoneMatch = raw.match(/رقم الهاتف المربوط[:\s]+([^\n\r]+)/);
        const nameMatch = raw.match(/اسم صاحب الحساب[:\s]+([^\n\r]+)/);
        const cifMatch = raw.match(/رقم العميل\s*\(CIF\)[:\s]+([^\n\r]+)/);
        const branchMatch = raw.match(/الفرع[:\s]+([^\n\r]+)/);
        const accMatch = raw.match(/رقم الحساب[:\s]+([^\n\r]+)/);
        const statusMatch = raw.match(/الحالة[:\s]+([^\n\r]+)/);

        document.getElementById("resPhone").innerText = phoneMatch ? phoneMatch[1].trim() : "غير متوفر";
        document.getElementById("resName").innerText = nameMatch ? nameMatch[1].trim() : "--";
        document.getElementById("resCif").innerText = cifMatch ? cifMatch[1].trim() : "--";
        document.getElementById("resBranch").innerText = branchMatch ? branchMatch[1].trim() : "--";
        document.getElementById("resAccount").innerText = accMatch ? accMatch[1].trim() : "--";
        if (statusMatch) document.getElementById("accountStatusTag").innerText = statusMatch[1].trim();

        document.getElementById("resultPanel").style.display = "block";
    }

    function copyPhone() {
        const phone = document.getElementById("resPhone").innerText.trim();
        if (!phone || phone === "--" || phone === "غير متوفر") return;
        navigator.clipboard.writeText(phone).then(() => {
            const btn = document.getElementById("copyBtnText");
            btn.innerText = "تم النسخ ✓";
            setTimeout(() => { btn.innerText = "نسخ"; }, 1500);
        });
    }

    function resetQuery() {
        document.getElementById("cifInput").value = "";
        document.getElementById("resultPanel").style.display = "none";
    }

    function showAlert(msg) {
        const el = document.getElementById("alertBox");
        el.innerText = msg;
        el.style.display = "block";
    }
</script>

</body>
</html>
